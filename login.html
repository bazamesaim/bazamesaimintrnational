<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050505"
    >

    <meta
        name="description"
        content="Bazam-E-Saim - Sign In"
    >

    <title>Sign In - Bazam-E-Saim</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="shortcut icon" href="logo.png">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --black: #050505;
            --black-2: #0a0a0a;
            --black-3: #111111;

            --gold: #d4af37;
            --gold-light: #f3d77a;
            --gold-soft: #e7c65c;

            --white: #ffffff;
            --text: #eeeeee;
            --muted: #a9a9a9;

            --border: rgba(212, 175, 55, 0.28);

            --shadow:
                0 0 25px rgba(212, 175, 55, 0.08),
                0 15px 50px rgba(0, 0, 0, 0.65);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(212, 175, 55, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(212, 175, 55, 0.08),
                    transparent 32%
                ),
                #050505;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;

            position: relative;
        }

        /* =====================================================
           MOVING GOLD GLOW
        ===================================================== */

        body::before,
        body::after {
            content: "";
            position: fixed;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(80px);

            opacity: 0.16;

            z-index: 0;
        }

        body::before {
            background: var(--gold);

            top: -160px;
            left: -140px;

            animation:
                glowMoveOne 9s ease-in-out infinite alternate;
        }

        body::after {
            background: var(--gold-light);

            right: -160px;
            bottom: -170px;

            animation:
                glowMoveTwo 11s ease-in-out infinite alternate;
        }

        @keyframes glowMoveOne {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(120px, 100px) scale(1.15);
            }

            100% {
                transform: translate(40px, 190px) scale(0.95);
            }
        }

        @keyframes glowMoveTwo {
            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-120px, -90px) scale(1.12);
            }

            100% {
                transform: translate(-50px, -170px) scale(0.92);
            }
        }

        /* =====================================================
           PAGE
        ===================================================== */

        .login-page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 18px;

            position: relative;
            z-index: 2;
        }

        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {
            width: 100%;
            max-width: 440px;

            background:
                linear-gradient(
                    145deg,
                    rgba(20, 20, 20, 0.98),
                    rgba(7, 7, 7, 0.98)
                );

            border: 1px solid var(--border);

            border-radius: 18px;

            padding: 32px 30px;

            box-shadow: var(--shadow);

            position: relative;

            overflow: hidden;

            animation: cardAppear 0.7s ease forwards;
        }

        .login-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold-light),
                    transparent
                );

            animation: goldLine 4s ease-in-out infinite;
        }

        @keyframes goldLine {
            0% {
                left: -100%;
            }

            50% {
                left: 100%;
            }

            100% {
                left: 100%;
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =====================================================
           LOGO
        ===================================================== */

        .logo-area {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo-wrap {
            width: 86px;
            height: 86px;

            margin: 0 auto 15px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #080808;

            border:
                1px solid rgba(
                    212,
                    175,
                    55,
                    0.45
                );

            box-shadow:
                0 0 18px rgba(
                    212,
                    175,
                    55,
                    0.12
                );

            overflow: hidden;
        }

        .logo-wrap img {
            width: 100%;
            height: 100%;

            object-fit: contain;

            display: block;
        }

        .site-title {
            color: var(--gold-light);

            font-family: "Cinzel", serif;

            font-size: 25px;

            font-weight: 700;

            letter-spacing: 0.5px;
        }

        .site-subtitle {
            margin-top: 6px;

            color: var(--muted);

            font-size: 13px;
        }

        .urdu-title {
            margin-top: 9px;

            color: var(--gold-soft);

            font-family:
                "Noto Naskh Arabic",
                serif;

            font-size: 20px;

            direction: rtl;
        }

        /* =====================================================
           HEADING
        ===================================================== */

        .login-heading {
            text-align: center;

            margin: 22px 0 24px;
        }

        .login-heading h1 {
            color: #fff;

            font-size: 25px;

            font-weight: 700;
        }

        .login-heading p {
            margin-top: 7px;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.6;
        }

        .login-heading .urdu {
            margin-top: 7px;

            color: #c8c8c8;

            font-family:
                "Noto Naskh Arabic",
                serif;

            font-size: 17px;

            direction: rtl;
        }

        /* =====================================================
           FORM
        ===================================================== */

        .login-form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            color: #ddd;

            font-size: 13px;

            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;

            height: 48px;

            padding:
                0 14px;

            border-radius: 9px;

            border:
                1px solid #333;

            outline: none;

            background: #0b0b0b;

            color: #fff;

            font-size: 14px;

            transition:
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .input-wrap input::placeholder {
            color: #666;
        }

        .input-wrap input:focus {
            border-color: var(--gold);

            background: #0e0e0e;

            box-shadow:
                0 0 0 3px
                rgba(
                    212,
                    175,
                    55,
                    0.08
                );
        }

        /* =====================================================
           MAIN LOGIN BUTTON
        ===================================================== */

        .login-btn {
            width: 100%;

            min-height: 49px;

            border: 1px solid var(--gold);

            border-radius: 9px;

            background:
                linear-gradient(
                    135deg,
                    #d4af37,
                    #f0d36d
                );

            color: #080808;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                filter 0.2s ease;

            margin-top: 5px;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            filter: brightness(1.06);

            box-shadow:
                0 8px 25px
                rgba(
                    212,
                    175,
                    55,
                    0.20
                );
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            cursor: not-allowed;

            opacity: 0.6;

            transform: none;

            box-shadow: none;
        }

        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 22px 0;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #2d2d2d;
        }

        .divider span {
            color: #777;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        /* =====================================================
           GOOGLE BUTTON
        ===================================================== */

        .google-btn {
            width: 100%;

            min-height: 49px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 11px;

            border:
                1px solid #3a3a3a;

            border-radius: 9px;

            background: #101010;

            color: #fff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .google-btn:hover {
            background: #161616;

            border-color:
                rgba(
                    212,
                    175,
                    55,
                    0.55
                );

            transform: translateY(-2px);

            box-shadow:
                0 7px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.35
                );
        }

        .google-btn:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .google-icon {
            width: 20px;
            height: 20px;

            display: block;
        }

        /* =====================================================
           STATUS / ERROR
        ===================================================== */

        .status-message {
            display: none;

            margin-top: 16px;

            padding: 11px 12px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;

            text-align: center;
        }

        .status-message.show {
            display: block;
        }

        .status-message.error {
            color: #ffb4b4;

            background:
                rgba(
                    160,
                    35,
                    35,
                    0.12
                );

            border:
                1px solid
                rgba(
                    255,
                    80,
                    80,
                    0.25
                );
        }

        .status-message.success {
            color: var(--gold-light);

            background:
                rgba(
                    212,
                    175,
                    55,
                    0.08
                );

            border:
                1px solid
                rgba(
                    212,
                    175,
                    55,
                    0.25
                );
        }

        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-area {
            margin-top: 23px;

            text-align: center;
        }

        .back-link {
            color: var(--gold-light);

            text-decoration: none;

            font-size: 13px;

            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {
            margin-top: 23px;

            padding-top: 17px;

            border-top:
                1px solid #222;

            text-align: center;
        }

        .login-footer p {
            color: #666;

            font-size: 11px;

            line-height: 1.6;
        }

        .login-footer .gold {
            color: var(--gold-soft);
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 500px) {

            .login-page {
                padding: 18px 12px;
            }

            .login-card {
                padding: 27px 20px;

                border-radius: 15px;
            }

            .site-title {
                font-size: 22px;
            }

            .login-heading h1 {
                font-size: 22px;
            }

            .logo-wrap {
                width: 76px;
                height: 76px;
            }
        }

        @media (max-height: 650px) {

            .login-page {
                align-items: flex-start;

                padding-top: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="logo-area">

                <div class="logo-wrap">
                    <img
                        src="logo.png"
                        alt="Bazam-E-Saim Logo"
                        onerror="this.style.display='none';"
                    >
                </div>

                <div class="site-title">
                    Bazam-E-Saim
                </div>

                <div class="site-subtitle">
                    Official Website
                </div>

                <div class="urdu-title">
                    بزمِ صائم
                </div>

            </div>


            <!-- =================================================
                 LOGIN HEADING
            ================================================== -->

            <div class="login-heading">

                <h1>
                    Sign In
                </h1>

                <p>
                    Sign in to like, share and comment
                    on books, videos and shorts.
                </p>

                <div class="urdu">
                    کتابوں، ویڈیوز اور شارٹس پر لائک،
                    شیئر اور کمنٹ کرنے کے لیے سائن اِن کریں
                </div>

            </div>


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="login-form"
                class="login-form"
                novalidate
            >

                <div class="form-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <div class="input-wrap">

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="input-wrap">

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    id="login-btn"
                    class="login-btn"
                >
                    Sign In
                </button>

            </form>


            <!-- =================================================
                 DIVIDER
            ================================================== -->

            <div class="divider">
                <span>OR</span>
            </div>


            <!-- =================================================
                 GOOGLE SIGN IN
                 ONLY LOGIN PAGE
            ================================================== -->

            <button
                type="button"
                id="google-login-btn"
                class="google-btn"
            >

                <svg
                    class="google-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        fill="#4285F4"
                        d="M21.35 12.27c0-.79-.07-1.55-.2-2.27H12v4.3h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z"
                    />

                    <path
                        fill="#34A853"
                        d="M12 21.8c2.63 0 4.84-.87 6.45-2.35l-3.14-2.45c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.3v2.53A9.75 9.75 0 0 0 12 21.8z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M6.54 13.9A5.86 5.86 0 0 1 6.23 12c0-.66.11-1.3.31-1.9V7.57H3.3A9.75 9.75 0 0 0 2.25 12c0 1.57.38 3.05 1.05 4.43l3.24-2.53z"
                    />

                    <path
                        fill="#EA4335"
                        d="M12 6.07c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 3.16 14.63 2.2 12 2.2a9.75 9.75 0 0 0-8.7 5.37l3.24 2.53C7.31 7.79 9.46 6.07 12 6.07z"
                    />
                </svg>

                <span>
                    Continue with Google
                </span>

            </button>


            <!-- =================================================
                 STATUS
            ================================================== -->

            <div
                id="login-message"
                class="status-message"
                role="alert"
                aria-live="polite"
            ></div>


            <!-- =================================================
                 BACK TO WEBSITE
            ================================================== -->

            <div class="back-area">

                <a
                    href="index.html"
                    class="back-link"
                >
                    ← Back to Bazam-E-Saim
                </a>

            </div>


            <!-- =================================================
                 FOOTER
            ================================================== -->

            <footer class="login-footer">

                <p>
                    © 2026
                    <span class="gold">
                        Bazam-E-Saim
                    </span>
                    — All Rights Reserved.
                </p>

            </footer>

        </section>

    </main>


    <!-- =====================================================
         LOGIN JAVASCRIPT
         =====================================================

         Firebase logic is intentionally kept in login.js.
         This page only provides the interface.

    ====================================================== -->

    <script type="module" src="login.js"></script>

</body>
</html>
