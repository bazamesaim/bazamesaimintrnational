<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bazam-E-Saim | Sign In</title>

  <link rel="icon" href="logo.png">

  <link rel="stylesheet" href="style.css">

</head>


<body class="login-page">

  <main class="login-wrapper">

    <div class="login-card">

      <img
        src="logo.png"
        alt="Bazam-E-Saim"
        class="login-logo"
      >

      <span class="eyebrow">
        OFFICIAL WEBSITE
      </span>

      <h1>
        Bazam-E-Saim
      </h1>

      <div class="urdu login-urdu">
        بزمِ صائم
      </div>

      <p>
        Sign in to like, share and comment on books, videos and shorts.
      </p>


      <form id="loginForm">

        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >

        <button
          type="submit"
          class="gold-btn full-btn"
        >
          Sign In
        </button>

      </form>


      <button
        type="button"
        id="googleLogin"
        class="google-btn"
      >
        Continue with Google
      </button>


      <button
        type="button"
        id="signupBtn"
        class="text-btn"
      >
        Create New Account
      </button>


      <div
        id="loginMessage"
        class="login-message"
      ></div>


      <a
        href="index.html"
        class="back-home"
      >
        ← Back to Website
      </a>

    </div>

  </main>


  <script type="module" src="script.js"></script>

</body>

</html>
