<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In - Bazam-E-Saim</title>

  <link rel="icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #d4af37;
      border-radius: 18px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 8px;
    }

    .urdu {
      direction: rtl;
      font-size: 20px;
      margin-bottom: 25px;
      color: #eee;
    }

    .google-btn {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: white;
      color: #222;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .google-btn:hover {
      background: #eee;
    }

    .google-icon {
      width: 22px;
      height: 22px;
    }

    #message {
      margin-top: 18px;
      min-height: 25px;
      color: #d4af37;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #d4af37;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img src="logo.png" class="logo" alt="Bazam-E-Saim">

    <h1>Bazam-E-Saim</h1>

    <div class="urdu">
      بزمِ صائم
    </div>

    <p style="margin-bottom:20px;">
      Sign in to like and comment on videos.
    </p>

    <button id="googleLogin" class="google-btn">
      <img
        class="google-icon"
        src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
        alt="Google"
      >
      Continue with Google
    </button>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Website
    </a>

  </div>

  <script type="module" src="login.js"></script>

</body>
</html>
