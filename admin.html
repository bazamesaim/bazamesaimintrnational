<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Panel | Bazam-E-Saim</title>

  <link rel="icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #050505;
      color: #f5d76e;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(212, 165, 45, 0.13);
      filter: blur(100px);
      z-index: -1;
      pointer-events: none;
      animation: glowMove 10s ease-in-out infinite alternate;
    }

    body::before {
      top: 5%;
      left: 5%;
    }

    body::after {
      right: 5%;
      bottom: 5%;
      animation-delay: 3s;
    }

    @keyframes glowMove {
      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(100px, 50px);
      }
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .login-card {
      width: min(430px, 100%);
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid rgba(218, 175, 55, 0.55);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow:
        0 0 25px rgba(218, 175, 55, 0.12),
        inset 0 0 30px rgba(218, 175, 55, 0.025);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 10px rgba(255, 205, 60, 0.4));
    }

    .brand {
      font-size: 13px;
      letter-spacing: 5px;
      color: #d9b83f;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 32px;
      color: #f2d064;
      margin-bottom: 5px;
    }

    .urdu {
      direction: rtl;
      font-size: 18px;
      margin-bottom: 20px;
      color: #d4af37;
    }

    .description {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .google-btn {
      width: 100%;
      border: 1px solid #d6ae3d;
      border-radius: 10px;
      background: linear-gradient(
        135deg,
        #ffe28a,
        #c99724
      );
      color: #111;
      font-size: 16px;
      font-weight: bold;
      padding: 15px;
      cursor: pointer;
      transition: 0.25s;
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(238, 195, 71, 0.35);
    }

    .google-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 25px;
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      color: #ff6565;
    }

    .success {
      color: #8ee58e;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #d9b83f;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      color: #666;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="login-card">

      <img
        src="logo.png"
        alt="Bazam-E-Saim Logo"
        class="logo"
      >

      <div class="brand">
        BAZAM-E-SAIM
      </div>

      <h1>Admin Panel</h1>

      <div class="urdu">
        ایڈمن پینل
      </div>

      <p class="description">
        Sign in with your authorized Google account
        to manage Bazam-E-Saim content.
      </p>

      <button
        id="googleLoginBtn"
        class="google-btn"
        type="button"
      >
        Continue with Google
      </button>

      <div
        id="message"
        class="message"
      ></div>

      <a
        href="index.html"
        class="back"
      >
        ← Back to Website
      </a>

      <footer>
        © 2026 Bazam-E-Saim — All Rights Reserved.
      </footer>

    </section>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
