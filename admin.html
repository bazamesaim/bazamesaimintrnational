<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Panel | Bazam-E-Saim</title>

  <link rel="icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 15% 25%, rgba(212,168,55,.18), transparent 25%),
        radial-gradient(circle at 85% 75%, rgba(212,168,55,.13), transparent 25%),
        #030303;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      background: rgba(218, 170, 45, .07);
      filter: blur(100px);
      border-radius: 50%;
      top: 5%;
      left: 5%;
      animation: glowMove 8s infinite alternate ease-in-out;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(218, 170, 45, .06);
      filter: blur(100px);
      border-radius: 50%;
      right: 5%;
      bottom: 5%;
      animation: glowMove2 10s infinite alternate ease-in-out;
      pointer-events: none;
    }

    @keyframes glowMove {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(150px, 80px);
      }
    }

    @keyframes glowMove2 {
      from {
        transform: translate(0, 0);
      }
      to {
        transform: translate(-120px, -100px);
      }
    }

    .admin-login {
      width: min(440px, 92%);
      padding: 40px 32px;
      background: rgba(13, 13, 13, .94);
      border: 1px solid rgba(225, 183, 61, .5);
      border-radius: 22px;
      box-shadow:
        0 0 35px rgba(225, 183, 61, .08),
        inset 0 0 30px rgba(225, 183, 61, .025);
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 14px;
      filter: drop-shadow(0 0 12px rgba(231, 191, 70, .45));
    }

    .brand {
      color: #e7c65a;
      letter-spacing: 4px;
      font-size: 13px;
      margin-bottom: 8px;
    }

    h1 {
      color: #f0cf65;
      font-size: 32px;
      margin-bottom: 5px;
    }

    .urdu {
      color: #d9b64f;
      direction: rtl;
      font-size: 18px;
      margin-bottom: 20px;
    }

    .description {
      color: #aaa;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .google-btn {
      width: 100%;
      border: none;
      padding: 15px 18px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f8dd82, #c89d36);
      color: #080808;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .25s ease;
    }

    .google-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(225, 183, 61, .22);
    }

    .google-icon {
      background: #fff;
      color: #4285f4;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 8px;
      font-weight: bold;
    }

    #message {
      min-height: 24px;
      margin-top: 18px;
      color: #e5c55b;
      font-size: 14px;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #d9b64f;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: #fff;
    }

    .copyright {
      color: #666;
      font-size: 12px;
      margin-top: 28px;
    }

    @media (max-width: 500px) {
      .admin-login {
        padding: 32px 22px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="admin-login">

    <img src="logo.png" class="logo" alt="Bazam-E-Saim Logo">

    <div class="brand">BAZAM-E-SAIM</div>

    <h1>Admin Panel</h1>

    <div class="urdu">ایڈمن پینل</div>

    <p class="description">
      Sign in with your authorized Firebase account.
    </p>

    <button id="googleLoginBtn" class="google-btn">
      <span class="google-icon">G</span>
      Continue with Google
    </button>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Back to Website
    </a>

    <div class="copyright">
      © 2026 Bazam-E-Saim — All Rights Reserved.
    </div>

  </main>

  <script type="module" src="admin.js"></script>

</body>
</html>
