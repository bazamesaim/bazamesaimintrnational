<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Videos | Bazam-E-Saim</title>

  <link
    rel="icon"
    type="image/png"
    href="logo.png"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body class="videos-page">


  <!-- =====================================================
       NAVBAR
  ====================================================== -->

  <header class="site-header">

    <div class="nav-container">

      <a
        href="index.html"
        class="brand"
      >

        <img
          src="logo.png"
          alt="Bazam-E-Saim Logo"
          class="brand-logo"
        >

        <div class="brand-text">

          <strong>
            Bazam-E-Saim
          </strong>

          <span>
            بزمِ صائم
          </span>

        </div>

      </a>


      <nav class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="books.html">
          Books
        </a>

        <a
          href="videos.html"
          class="active"
        >
          Videos
        </a>

        <a href="shorts.html">
          Shorts
        </a>

        <a
          href="https://hassanbhai5559-lgtm.github.io/chishti-library/"
          target="_blank"
          rel="noopener"
        >
          Chishti Library
        </a>

        <a
          href="login.html"
          class="nav-btn"
        >
          Sign In
        </a>

        <a
          href="admin.html"
          class="nav-btn"
        >
          Admin
        </a>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       VIDEOS
  ====================================================== -->

  <main>

    <section
      id="videos"
      class="content-section dark-section"
    >

      <div class="section-heading">

        <span>
          VIDEO COLLECTION
        </span>

        <h1>
          Videos
        </h1>

        <p class="urdu">
          ویڈیوز
        </p>

        <p>
          Watch complete videos and beautiful Islamic content.
        </p>

      </div>


      <div class="slider-wrapper">

        <button
          class="slider-btn prev-btn"
          data-target="videosViewport"
          type="button"
          aria-label="Previous videos"
        >
          ‹
        </button>


        <div
          id="videosViewport"
          class="slider-viewport"
        >

          <div
            id="videosTrack"
            class="slider-track"
          >

            <div class="loading">
              Loading Videos...
            </div>

          </div>

        </div>


        <button
          class="slider-btn next-btn"
          data-target="videosViewport"
          type="button"
          aria-label="Next videos"
        >
          ›
        </button>

      </div>

    </section>

  </main>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <footer class="site-footer">

    <div class="footer-content">

      <div class="footer-brand">

        <img
          src="logo.png"
          alt="Bazam-E-Saim"
        >

        <div>

          <strong>
            Bazam-E-Saim
          </strong>

          <span>
            بزمِ صائم
          </span>

        </div>

      </div>


      <div class="footer-links">

        <a href="index.html">
          Home
        </a>

        <a href="books.html">
          Books
        </a>

        <a href="videos.html">
          Videos
        </a>

        <a href="shorts.html">
          Shorts
        </a>

        <a
          href="https://hassanbhai5559-lgtm.github.io/chishti-library/"
          target="_blank"
        >
          Chishti Library
        </a>

      </div>


      <p>
        © 2026 Bazam-E-Saim. All Rights Reserved.
      </p>

    </div>

  </footer>


  <a
    href="https://wa.me/"
    class="whatsapp-float"
    target="_blank"
    rel="noopener"
    aria-label="WhatsApp"
  >
    ☎
  </a>


  <script src="script.js"></script>

</body>
</html>
